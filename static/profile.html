<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica - Prontuário do Paciente</title>
    <link rel="stylesheet" href="styles/profile.style.css">
</head>

<body>
    <div id="container">
        <h1>🏥 Prontuário do Paciente</h1>
        
        <div id="user-info">
            <div>
                <strong>Nome Completo:</strong>
                <p>{{.FullName}}</p>
            </div>

            <div>
                <strong>CPF:</strong>
                <p>{{.CPF}}</p>
            </div>

            <div>
                <strong>Data de Nascimento:</strong>
                <p>{{.BirthDate}}</p>
            </div>

            <div>
                <strong>Sintomas Relatados:</strong>
                <p>{{.Symptoms}}</p>
            </div>

            <div>
                <strong>Status do Atendimento:</strong>
                <p>{{.Status}}</p>
            </div>
        </div>

        <div style="margin-top: 2rem;">
            <a href="/index.html" style="text-decoration: none; color: #fff; background-color: #0072b9; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: inline-block;">Voltar ao Menu</a>
        </div>
    </div>
</body>

</html>
