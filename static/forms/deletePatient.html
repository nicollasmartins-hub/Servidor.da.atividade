<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica - Alta Médica</title>
    <link rel="stylesheet" href="../styles/deletePatient.style.css">
</head>

<body>
    <div id="container">
        <h3>Dar Alta ao Paciente</h3>
        
        <p style="text-align: center; margin-bottom: 20px; color: #555;">
            Insira o CPF do paciente para registrar a alta e removê-lo do sistema ativo.
        </p>

        <form method="POST" action="/deletePatient">
            <div>
                <label>CPF do Paciente:</label>
                <input name="cpf" placeholder="Apenas números" type="text" required>
            </div>
            
            <button type="submit" style="background-color: #d9534f;">
                <span>Registrar Alta (Remover)</span>
            </button>
        </form>
    </div>
</body>

</html>
