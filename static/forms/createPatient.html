<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Médica - Cadastro de Paciente</title>
    <link rel="stylesheet" href="../styles/createPatient.style.css">
</head>
<body>
    <div id="container">
        <h3>Cadastro de Paciente</h3>

        <form action="/createPatient" method="POST">
            <div>
                <label>Nome Completo</label>
                <input type="text" name="nome" required placeholder="Ex: João Silva">
            </div>

            <div>
                <label>CPF</label>
                <input type="text" name="cpf" required placeholder="000.000.000-00">
            </div>

            <div>
                <label>Data de Nascimento</label>
                <input type="date" name="data_nascimento" required>
            </div>

            <div>
                <label>Telefone / WhatsApp</label>
                <input type="tel" name="telefone" required placeholder="(11) 99999-9999">
            </div>

            <!-- Campo novo: Sintomas -->
            <div>
                <label>Sintomas / Observações</label>
                <input type="text" name="sintomas" placeholder="Opcional">
            </div>

            <button type="submit">Cadastrar Paciente</button>
        </form>
    </div>
</body>
</html>
